<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo class element</title>
    <link rel="stylesheet" href="pseudoclass.css">
</head>
<body>
    <h1>Pseudo Class</h1>
    <!-- tooltip using hover pseudo class -->

    <div id="tooltip" >
        <b>Hover Me To Display Tooltip</b>
        <p id="tooltip-content" >
            I am a ToolTip text from above element
        </p>
    </div>

</body>

</html>
